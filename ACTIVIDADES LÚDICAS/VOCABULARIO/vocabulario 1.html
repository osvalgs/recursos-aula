<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   PALABRAS  —  AQUÍ SE AÑADEN LAS PALABRAS NUEVAS CADA SEMANA
   ---------------------------------------------------------------------
   · palabra:   escribe entre [corchetes] las letras difíciles; saldrán
                en rojo y más grandes. Ej.: "[h]ip[é]r[b]ole"
   · pista:     nota ortográfica breve (aparece a mano, en rojo).
   · icono:     nombre de un icono de la biblioteca (ver ICONOS más abajo)
                o un emoji, p. ej. "🦉". Si lo dejas vacío, sale un libro.
   · Las diapositivas se generan solas, de tres en tres.
   ===================================================================== */
const PALABRAS = [
  // ---------- SEMANA 1 ----------
  { semana: 1, palabra: "perspica[z]", pista: "z final → plural perspicaces",
    significado: "Que tiene agudeza e ingenio para comprender las cosas con rapidez.",
    sinonimos: ["agudo", "sagaz"], icono: "ojo" },
  { semana: 1, palabra: "[h]ip[é]r[b]ole", pista: "h inicial, b y tilde (esdrújula)",
    significado: "Figura retórica que consiste en exagerar aquello de lo que se habla.",
    sinonimos: ["exageración", "ponderación"], icono: "megafono" },
  { semana: 1, palabra: "desa[h]o[g]o", pista: "h intercalada: des + ahogo",
    significado: "Alivio de una pena, un trabajo o una necesidad.",
    sinonimos: ["alivio", "descanso"], icono: "suspiro" },
  { semana: 1, palabra: "ad[v]er[b]io", pista: "primero v, después b",
    significado: "Categoría gramatical que modifica el significado del verbo, del adjetivo o de otro adverbio.",
    sinonimos: ["modificador", "partícula"], icono: "etiqueta" },
  { semana: 1, palabra: "in[h][ó]spito", pista: "h intercalada y tilde (esdrújula)",
    significado: "Que no ofrece condiciones agradables o de seguridad para vivir.",
    sinonimos: ["hostil", "inhabitable"], icono: "desierto" },
  { semana: 1, palabra: "[y]a[c]imiento", pista: "de yacer: y inicial, c ante i",
    significado: "Lugar donde se hallan naturalmente minerales, rocas o restos arqueológicos.",
    sinonimos: ["depósito", "filón"], icono: "yacimiento" },
  { semana: 1, palabra: "es[b]elto", pista: "¡con b, no con v!",
    significado: "Que tiene un cuerpo alto, delgado y de proporciones armoniosas.",
    sinonimos: ["delgado", "estilizado"], icono: "cipres" },
  { semana: 1, palabra: "ur[g]en[c]ia", pista: "ge con g; -encia con c",
    significado: "Cualidad de urgente, es decir, que necesita atención o solución inmediata.",
    sinonimos: ["emergencia", "premura"], icono: "sirena" },
  { semana: 1, palabra: "apo[g]eo", pista: "ge con g, no con j",
    significado: "Punto culminante o momento de mayor esplendor de algo.",
    sinonimos: ["culminación", "esplendor"], icono: "cumbre" },
  { semana: 1, palabra: "[v]a[ll]a", pista: "valla (cerca) ≠ vaya (ir) ≠ baya (fruto)",
    significado: "Cercado de tablas, estacas u otro material que delimita un terreno.",
    sinonimos: ["cercado", "vallado"], icono: "valla" },
  { semana: 1, palabra: "[v]islum[b]rar", pista: "v inicial; tras m, siempre b",
    significado: "Ver algo de forma confusa o a lo lejos, o intuirlo por indicios.",
    sinonimos: ["entrever", "atisbar"], icono: "prismaticos" },
  { semana: 1, palabra: "espar[c]ir", pista: "verbos en -cir: con c",
    significado: "Extender o separar lo que estaba junto o amontonado.",
    sinonimos: ["dispersar", "difundir"], icono: "semillas" },

  // ---------- SEMANA 2 ----------
  // { semana: 2, palabra: "...", pista: "...", significado: "...", sinonimos: ["...", "..."], icono: "🦉" },
];
</script>
<style>
:root{
  --paper:#FAFCFF;
  --rule:#BCD4EE;
  --ink:#1D2B5C;
  --ink-soft:#56628A;
  --red:#D62839;
  --yellow:#FFE35A;
  --mint:#A8E6CF;
  --teal:#157A6E;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 5.2rem, #F3B6BD 5.2rem, #F3B6BD calc(5.2rem + 2px), transparent calc(5.2rem + 2px)),
    repeating-linear-gradient(to bottom, transparent 0 31px, #E6EEF8 31px 32px);
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}

/* ---------- barra superior ---------- */
.top{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  padding:.7rem 1.4rem .7rem 6.2rem;
}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.02em;margin-right:auto}
.brand .hl{font-size:1.2em}
.ctl{
  background:#fff;border:2px solid var(--ink);border-radius:999px;
  padding:.35rem .9rem;font-size:.9rem;cursor:pointer;
}
.ctl[aria-pressed="true"]{background:var(--ink);color:#fff}
select.ctl{padding-right:.6rem}

/* ---------- escenario ---------- */
main{flex:1;display:flex;align-items:stretch;padding:0 1.4rem 0 6.2rem;min-height:0}
.slide{width:100%;display:flex;flex-direction:column;justify-content:center;padding:1rem 0 1.5rem}

/* ---------- pauta caligráfica y letras difíciles ---------- */
.pauta{
  position:relative;display:block;white-space:nowrap;
  line-height:1.5;padding:0 .15em;
  background:
    linear-gradient(to bottom,
      transparent calc(24% - 1px), var(--rule) calc(24% - 1px), var(--rule) 24%, transparent 24%,
      transparent calc(76% - 2px), var(--rule) calc(76% - 2px), var(--rule) 76%, transparent 76%),
    repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px) 0 48% / 100% 1px no-repeat;
}
.hl{
  color:var(--red);font-size:1.3em;display:inline-block;
  position:relative;line-height:1;transform:translateY(.02em);
}
.hl::after{
  content:"";position:absolute;left:-.05em;right:-.05em;bottom:-.12em;height:.14em;
  background:var(--red);border-radius:50% 40% 60% 45%;transform:rotate(-2deg);opacity:.85;
}

/* ---------- portada ---------- */
.cover{align-items:flex-start;gap:1.2rem}
.cover h1{font-size:clamp(3rem,10vw,9rem);font-weight:800;letter-spacing:.01em;line-height:1}
.cover p{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink-soft);max-width:40ch}
.cover .note{font-family:"Caveat",cursive;color:var(--red);font-size:clamp(1.4rem,2.4vw,2.2rem);transform:rotate(-2deg)}
.big{
  background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:.8rem 2rem;font-size:1.2rem;font-weight:600;cursor:pointer;margin-top:.6rem;
}

/* ---------- tarjetas de palabra ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2.5vw,2.5rem);align-items:start}
.card{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.ico{height:clamp(70px,11vh,120px);display:flex;align-items:flex-end}
.ico svg{height:100%;width:auto;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico .a{fill:var(--yellow)} .ico .g{fill:var(--mint)} .ico .r{fill:var(--red)} .ico .k{fill:var(--ink);stroke:none}
.ico .emoji{font-size:clamp(56px,9vh,100px);line-height:1}
.word{
  font-size:clamp(1.9rem,3.7vw,3.6rem);font-weight:600;cursor:default;
  border-radius:4px;transition:filter .3s;
}
.pista{font-family:"Caveat",cursive;font-size:clamp(1.25rem,1.9vw,1.8rem);color:var(--red);line-height:1.1;transform:rotate(-1.2deg);transform-origin:left}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.tog{
  border:2px solid var(--ink);background:#fff;border-radius:10px;
  padding:.4rem .8rem;font-size:clamp(.85rem,1.1vw,1rem);cursor:pointer;font-weight:600;
}
.tog[aria-expanded="true"]{background:var(--ink);color:#fff}
.box{display:none;font-size:clamp(1rem,1.45vw,1.3rem);line-height:1.5;max-width:34ch}
.box.open{display:block;animation:pop .25s ease-out}
.box.sig{border-left:4px solid var(--teal);padding-left:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem .8rem;list-style:none;padding:0}
.chips li{
  font-weight:600;padding:0 .3em;
  background:linear-gradient(100deg, transparent 2%, var(--yellow) 4%, var(--yellow) 94%, transparent 98%) 0 60% / 100% 70% no-repeat;
}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* modo reto: se oculta la palabra y se muestra el significado */
body.reto .word:not(.shown){filter:blur(14px);cursor:pointer;user-select:none}
body.reto .word:not(.shown) .hl::after{display:none}
body.reto .pista:not(.shown){visibility:hidden}

/* ---------- juego ---------- */
.quiz{gap:1.2rem}
.quiz .q{font-size:clamp(1.3rem,2.6vw,2.3rem);line-height:1.35;max-width:36ch;border-left:5px solid var(--teal);padding-left:1rem}
.opts{display:flex;flex-wrap:wrap;gap:1rem}
.opt{
  background:#fff;border:3px solid var(--ink);border-radius:14px;cursor:pointer;
  padding:.4rem 1.4rem;font-size:clamp(1.4rem,2.8vw,2.6rem);font-weight:600;
}
.opt.ok{border-color:var(--teal);background:#DDF5EC}
.opt.ko{border-color:var(--red);background:#FCE3E6;text-decoration:line-through}
.fb{font-family:"Caveat",cursive;font-size:clamp(1.5rem,2.6vw,2.4rem);min-height:1.3em}
.fb.ok{color:var(--teal)} .fb.ko{color:var(--red)}
.fb{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;min-height:0}
.fb:empty{display:none}
.fb:not(:empty){margin-bottom:.6rem}
.sol{display:inline-block;font-family:"Lexend",sans-serif;font-weight:600;color:var(--ink);font-size:clamp(2.6rem,6vw,5rem);line-height:1.35;animation:pop .3s ease-out}
.fb-syn{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;font-family:"Lexend",sans-serif;font-size:clamp(1.2rem,2.2vw,2rem);color:var(--ink)}
.fb-syn .chips li{font-size:1em}
.score{color:var(--ink-soft)}

/* ---------- navegación ---------- */
.nav{display:flex;align-items:center;justify-content:center;gap:1rem;padding:.6rem 1.4rem 1rem 6.2rem}
.arrow{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.4rem;cursor:pointer}
.arrow:disabled{opacity:.3;cursor:default}
.count{min-width:6ch;text-align:center;font-weight:600}
.empty{font-size:1.4rem;color:var(--ink-soft)}

@media (max-width:820px){
  body{background-image:repeating-linear-gradient(to bottom, transparent 0 31px, #E6EEF8 31px 32px)}
  .top,main,.nav{padding-left:1rem;padding-right:1rem}
  .grid{grid-template-columns:1fr;gap:2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="pauta" style="display:inline-block">[V]OCA[B]ULARIO</span></div>
  <label>
    <select class="ctl" id="week" aria-label="Filtrar por semana"></select>
  </label>
  <button class="ctl" id="btnAll">Mostrar todo</button>
  <button class="ctl" id="btnReto" aria-pressed="false" title="Oculta las palabras y muestra el significado">Modo reto</button>
  <button class="ctl" id="btnFull" title="Pantalla completa (F)">⛶ Pantalla completa</button>
</header>

<main id="stage"></main>

<nav class="nav" aria-label="Diapositivas">
  <button class="arrow" id="prev" aria-label="Anterior">‹</button>
  <span class="count" id="count"></span>
  <button class="arrow" id="next" aria-label="Siguiente">›</button>
</nav>

<script>
/* ====================== BIBLIOTECA DE ICONOS ====================== */
const ICONOS = {
  ojo:`<path d="M5 32 Q32 8 59 32 Q32 56 5 32Z"/><circle class="a" cx="32" cy="32" r="10"/><circle class="k" cx="32" cy="32" r="4"/><path class="r" d="M52 5 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>`,
  megafono:`<path class="a" d="M8 25 h11 l25 -15 v44 l-25 -15 h-11z"/><path d="M14 39 l4 15 h7 l-3 -15"/><path d="M50 23 q5 9 0 18"/><path d="M55 16 q10 16 0 32"/>`,
  suspiro:`<circle class="a" cx="24" cy="32" r="18"/><path d="M15 28 q3 -3 6 0 M26 28 q3 -3 6 0"/><circle cx="28" cy="39" r="2.5"/><path d="M45 34 q4 -3 8 0 t8 0 M45 42 q4 3 8 0 t8 0"/>`,
  etiqueta:`<path class="a" d="M5 20 h38 l14 12 -14 12 h-38z"/><circle cx="47" cy="32" r="2.5"/><text x="23" y="37" font-size="12.5" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="600" fill="#1D2B5C" stroke="none">-mente</text>`,
  desierto:`<circle class="a" cx="49" cy="15" r="7"/><path d="M3 55 h58"/><path class="g" d="M26 55 v-31 a5 5 0 0 1 10 0 v31z"/><path d="M26 39 h-5 a4 4 0 0 1 -4 -4 v-7 M36 43 h5 a4 4 0 0 0 4 -4 v-7"/><path d="M8 55 q3 -4 6 0 M48 55 q3 -4 6 0"/>`,
  yacimiento:`<path class="a" d="M3 30 h58 v28 h-58z"/><path d="M3 43 q14 -5 29 0 t29 0"/><path d="M17 50 h14" stroke-width="4"/><circle cx="16" cy="48" r="2"/><circle cx="16" cy="52" r="2"/><circle cx="32" cy="48" r="2"/><circle cx="32" cy="52" r="2"/><path d="M44 30 l8 -24 M40 10 q12 -6 22 2"/>`,
  cipres:`<path class="g" d="M32 4 C45 20 43 44 35 54 h-6 C21 44 19 20 32 4z"/><path d="M32 54 v6 M20 60 h24 M32 22 v26"/>`,
  sirena:`<path class="r" d="M18 50 v-16 a14 14 0 0 1 28 0 v16z"/><path class="a" d="M12 50 h40 v8 h-40z"/><path d="M32 5 v7 M11 13 l5 5 M53 13 l-5 5 M3 32 h7 M54 32 h7"/>`,
  cumbre:`<path class="g" d="M3 57 L25 20 L35 34 L44 23 L61 57z"/><path d="M25 20 V5"/><path class="r" d="M25 5 L37 9.5 L25 14z"/>`,
  valla:`<path class="a" d="M8 57 V20 l5 -6 5 6 V57z M23 57 V20 l5 -6 5 6 V57z M38 57 V20 l5 -6 5 6 V57z"/><path d="M3 29 h56 M3 46 h56"/><path d="M53 57 V22 l5 -6"/>`,
  prismaticos:`<circle class="a" cx="19" cy="41" r="12"/><circle class="a" cx="45" cy="41" r="12"/><path d="M11 32 l5 -18 h7 l3 15 M53 32 l-5 -18 h-7 l-3 15 M29 37 h6"/><circle class="k" cx="19" cy="41" r="4"/><circle class="k" cx="45" cy="41" r="4"/>`,
  semillas:`<path class="a" d="M6 50 q6 -18 20 -18 l6 6 q-4 16 -20 18z"/><circle class="k" cx="40" cy="30" r="2.6"/><circle class="k" cx="48" cy="22" r="2.6"/><circle class="k" cx="46" cy="36" r="2.6"/><circle class="k" cx="56" cy="14" r="2.6"/><circle class="k" cx="57" cy="30" r="2.6"/><circle class="k" cx="54" cy="44" r="2.6"/><circle class="k" cx="38" cy="16" r="2.6"/>`,
  libro:`<path class="a" d="M32 16 q-12 -6 -26 -2 v36 q14 -4 26 2 q12 -6 26 -2 v-36 q-14 -4 -26 2z"/><path d="M32 16 v36"/>`
};
function icon(name){
  if(name && ICONOS[name]) return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONOS[name]}</svg>`;
  if(name) return `<span class="emoji" aria-hidden="true">${name}</span>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONOS.libro}</svg>`;
}

/* ====================== LÓGICA ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markup = p => esc(p).replace(/\[([^\]]+)\]/g,'<span class="hl">$1</span>');
const plain  = p => p.replace(/[\[\]]/g,'');

document.querySelectorAll('.brand .pauta').forEach(el => el.innerHTML = markup(el.textContent));

let lista = [], slides = [], cur = 0;
let quiz = null, score = {ok:0,total:0};

const semanas = [...new Set(PALABRAS.map(p => p.semana))].sort((a,b)=>a-b);
$('#week').innerHTML = `<option value="all">Todas las semanas</option>` +
  semanas.map(s => `<option value="${s}">Semana ${s}</option>`).join('');

function build(){
  const w = $('#week').value;
  lista = PALABRAS.map((p,i)=>({...p,id:i})).filter(p => w==='all' || String(p.semana)===w);
  slides = [{type:'cover'}];
  for(let i=0;i<lista.length;i+=3) slides.push({type:'words', items:lista.slice(i,i+3)});
  if(lista.length) slides.push({type:'quiz'});
}

function render(){
  const s = slides[cur];
  const st = $('#stage');
  if(s.type==='cover'){
    const n = lista.length, w = $('#week').value;
    st.innerHTML = `<section class="slide cover">
      <h1 class="pauta">${markup('[V]OCA[B]ULARIO')}</h1>
      <p>Repaso colectivo de significados y sinónimos. ${n} palabras${w==='all' ? ` en ${semanas.length} ${semanas.length===1?'semana':'semanas'}` : `, semana ${w}`}.</p>
      <span class="note">¡Ojo a las letras en rojo!</span>
      ${n ? `<button class="big" id="go">Empezar</button>` : `<p class="empty">No hay palabras en esta semana.</p>`}
    </section>`;
    const go = $('#go'); if(go) go.onclick = () => goTo(1);
  }
  else if(s.type==='words'){
    st.innerHTML = `<section class="slide"><div class="grid">${s.items.map(card).join('')}</div></section>`;
    st.querySelectorAll('.card').forEach(bindCard);
    fitWords();
  }
  else { renderQuiz(); }
  $('#count').textContent = `${cur+1} / ${slides.length}`;
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===slides.length-1;
  $('#btnAll').style.visibility = s.type==='words' ? 'visible' : 'hidden';
  $('#btnAll').textContent = 'Mostrar todo';
}

function card(p){
  const reto = document.body.classList.contains('reto');
  return `<article class="card">
    <div class="ico">${icon(p.icono)}</div>
    <h2 class="word pauta" tabindex="0" aria-label="${esc(plain(p.palabra))}">${markup(p.palabra)}</h2>
    <p class="pista">${esc(p.pista||'')}</p>
    <div class="acts">
      <button class="tog" data-t="sig" aria-expanded="${reto}">Significado</button>
      <button class="tog" data-t="sin" aria-expanded="false">Sinónimos</button>
    </div>
    <div class="box sig ${reto?'open':''}">${esc(p.significado)}</div>
    <div class="box sin"><ul class="chips">${p.sinonimos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </article>`;
}

function bindCard(c){
  c.querySelectorAll('.tog').forEach(b => b.onclick = () => {
    const box = c.querySelector('.box.'+b.dataset.t);
    const open = !box.classList.contains('open');
    box.classList.toggle('open', open);
    b.setAttribute('aria-expanded', open);
  });
  const w = c.querySelector('.word');
  const reveal = () => { w.classList.add('shown'); c.querySelector('.pista').classList.add('shown'); };
  w.onclick = reveal;
  w.onkeydown = e => { if(e.key==='Enter'){ reveal(); } };
}

function fitWords(){
  document.querySelectorAll('.word').forEach(w => {
    w.style.fontSize = '';
    let size = parseFloat(getComputedStyle(w).fontSize);
    while(w.scrollWidth > w.clientWidth && size > 16){ size -= 2; w.style.fontSize = size+'px'; }
  });
}

function showAll(){
  const cards = document.querySelectorAll('.card');
  const anyClosed = [...document.querySelectorAll('.box')].some(b => !b.classList.contains('open'));
  cards.forEach(c => {
    c.querySelectorAll('.box').forEach(b => b.classList.toggle('open', anyClosed));
    c.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-expanded', anyClosed));
    if(anyClosed){ c.querySelector('.word').classList.add('shown'); c.querySelector('.pista').classList.add('shown'); }
  });
  $('#btnAll').textContent = anyClosed ? 'Ocultar todo' : 'Mostrar todo';
}

/* ---------- juego: ¿qué palabra es? ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newQuiz(){
  const target = lista[Math.floor(Math.random()*lista.length)];
  const others = shuffle(PALABRAS.map((p,i)=>({...p,id:i})).filter(p=>p.id!==target.id)).slice(0,2);
  quiz = { target, opts: shuffle([target,...others]), done:false };
}
function renderQuiz(){
  if(!quiz || !lista.some(p=>p.id===quiz.target.id)) newQuiz();
  const q = quiz;
  $('#stage').innerHTML = `<section class="slide quiz">
    <h2 class="pauta" style="font-size:clamp(1.6rem,3vw,2.6rem);font-weight:800;align-self:flex-start">¿Qué palabra es?</h2>
    <p class="q">${esc(q.target.significado)}</p>
    <div class="opts">${q.opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(plain(o.palabra))}</button>`).join('')}</div>
    <p class="fb" id="fb"></p>
    <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <button class="big" id="again" style="margin:0">Otra definición</button>
      <span class="score">Aciertos: ${score.ok} de ${score.total}</span>
    </div>
  </section>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(q.done) return;
    q.done = true; score.total++;
    const ok = +b.dataset.id === q.target.id;
    if(ok) score.ok++;
    document.querySelectorAll('.opt').forEach(x => { if(+x.dataset.id===q.target.id) x.classList.add('ok'); });
    if(!ok) b.classList.add('ko');
    const fb = $('#fb');
    fb.className = 'fb ' + (ok?'ok':'ko');
    fb.innerHTML = `<span class="fb-lead">${ok ? '¡Correcto!' : 'La respuesta era:'}</span>
      <span class="sol pauta">${markup(q.target.palabra)}</span>
      <span class="fb-syn">Sinónimos: <ul class="chips">${q.target.sinonimos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></span>`;
    document.querySelector('.score').textContent = `Aciertos: ${score.ok} de ${score.total}`;
  });
  $('#again').onclick = () => { newQuiz(); renderQuiz(); };
}

/* ---------- navegación y controles ---------- */
function goTo(i){ cur = Math.max(0, Math.min(slides.length-1, i)); render(); }
$('#prev').onclick = () => goTo(cur-1);
$('#next').onclick = () => goTo(cur+1);
$('#btnAll').onclick = showAll;
$('#week').onchange = () => { build(); quiz=null; goTo(slides.length>1 ? 1 : 0); };
$('#btnReto').onclick = e => {
  const on = document.body.classList.toggle('reto');
  e.currentTarget.setAttribute('aria-pressed', on);
  render();
};
function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
$('#btnFull').onclick = toggleFull;
document.addEventListener('keydown', e => {
  if(e.target.tagName==='SELECT') return;
  const onButton = e.target.tagName==='BUTTON';
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && !onButton)){ e.preventDefault(); goTo(cur+1); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); goTo(cur-1); }
  else if(e.key==='f' || e.key==='F') toggleFull();
  else if((e.key==='m' || e.key==='M') && slides[cur].type==='words') showAll();
});
window.addEventListener('resize', () => { if(slides[cur]?.type==='words') fitWords(); });
document.fonts?.ready.then(() => { if(slides[cur]?.type==='words') fitWords(); });

build(); render();
</script>
</body>
